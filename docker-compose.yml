services:
  backend:
    build:
      context: ./src/weather/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./src/weather/frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    restart: unless-stopped
